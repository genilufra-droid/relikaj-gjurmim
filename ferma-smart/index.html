<style>
/* Layout: kokë ngjitës me tabelë, përmbajtje 960px; parcelat si hartë pllakash me sipërfaqe në përpjesëtim me hektarët */
:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --accent:#4cc38a;--accent-fg:#06180e;--sky:#6db6de;--good:#4cc38a;--warn:#e3a44a;--bad:#f08070;

:root[data-theme="dark"]{

  --accent:#4cc38a;--accent-fg:#06180e;--sky:#6db6de;--good:#4cc38a;--warn:#e3a44a;--bad:#f08070;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:14px;line-height:1.45;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:18px}h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 0;border-bottom:1px solid var(--line)}

.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:22px}
.brand small{color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.tabs button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
main{padding-block:18px;display:grid;gap:18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.two{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.two>*,.grid>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.card.flat{background:none;border-style:dashed}
.sec{display:grid;gap:10px}

.muted{color:var(--muted)}.small{font-size:12px}

.stat span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:500}

.list{display:grid;gap:0}

.map{position:relative;width:100%;aspect-ratio:100/62;border-radius:10px;overflow:hidden;background:var(--surface2)}

.cb{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center}

.pickc{border:1px solid var(--line);cursor:pointer}

<div class="top"><div class="wrap"><div class="brand"><h1>Ferma Smart</h1><small id="status" class="muted"></small></div><div class="tabs" id="tabs" role="tablist"></div></div></div><div class="wrap"><main id="main"></main></div><div id="modal" hidden></div><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script><script>
/* ===== Kohë, numra, formatim ===== */
const MONTHS = ['janar', 'shkurt', 'mars', 'prill', 'maj', 'qershor', 'korrik', 'gusht', 'shtator', 'tetor', 'nëntor', 'dhjetor'];
const WDAY = ['e diel', 'e hënë', 'e martë', 'e mërkurë', 'e enjte', 'e premte', 'e shtunë'];
const WDAY_S = ['Die', 'Hën', 'Mar', 'Mër', 'Enj', 'Pre', 'Sht'];
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => isoOf(new Date());
const utc = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const addDays = (s, n) => { const t = new Date(utc(s) + n * 864e5); return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate()); };
const diffDays = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);
const fmtDate = s => s ? s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4) : '';
const fmtShort = s => s ? s.slice(8, 10) + '.' + s.slice(5, 7) : '';
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtLong = s => { const t = new Date(utc(s)); return cap(WDAY[t.getUTCDay()]) + ', ' + t.getUTCDate() + ' ' + MONTHS[t.getUTCMonth()] + ' ' + t.getUTCFullYear(); };
const wdayShort = s => WDAY_S[new Date(utc(s)).getUTCDay()];
const relDay = (s, t) => { const d = diffDays(t, s); return d === 0 ? 'Sot' : d === 1 ? 'Nesër' : d === -1 ? 'Dje' : d < 0 ? (-d) + ' ditë më parë' : 'pas ' + d + ' ditësh'; };

/* Numra në formën shqipe: pikë për mijëshe, presje për dhjetore */
const num = (n, maxDec = 0) => {
  n = +n || 0;
  let s = Math.abs(n).toFixed(maxDec);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  const parts = s.split('.');
  const i = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (n < 0 && +s !== 0 ? '−' : '') + i + (parts[1] ? ',' + parts[1] : '');
};
const fmtL = n => num(n, 0) + ' L';
const fmtArea = ha => num(ha, 2) + ' ha';
const fmtDyn = ha => num(ha * 10, 1) + ' dynym';
const numIn = v => { const x = parseFloat(String(v == null ? '' : v).trim().replace(/\s/g, '').replace(',', '.')); return isNaN(x) ? 0 : x; };
const sum = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);
const uid = p => p + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 5);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const byDue = (a, b) => a.due < b.due ? -1 : a.due > b.due ? 1 : 0;

/* ===== Skica e parcelave (treemap i shtrydhur) — sipërfaqja e çdo pllake është në përpjesëtim me hektarët ===== */
function squarify(items, x, y, w, h) {
  const total = sum(items, i => i.v);
  if (!total || !items.length) return [];
  const k = (w * h) / total;
  const nodes = items.map(i => ({ item: i, a: i.v * k })).sort((a, b) => b.a - a.a);
  const out = [];
  let rect = { x: x, y: y, w: w, h: h }, row = [];
  const worst = (r, side) => {
    const s = sum(r, n => n.a);
    let mx = 0, mn = Infinity;
    r.forEach(n => { mx = Math.max(mx, n.a); mn = Math.min(mn, n.a); });
    return Math.max(side * side * mx / (s * s), (s * s) / (side * side * mn));
  };
  const lay = (r, q) => {
    const s = sum(r, n => n.a);
    if (q.w >= q.h) {
      const cw = s / q.h; let cy = q.y;
      r.forEach(n => { const ch = n.a / cw; out.push({ x: q.x, y: cy, w: cw, h: ch, item: n.item }); cy += ch; });
      return { x: q.x + cw, y: q.y, w: q.w - cw, h: q.h };
    }
    const rh = s / q.w; let cx = q.x;
    r.forEach(n => { const cw = n.a / rh; out.push({ x: cx, y: q.y, w: cw, h: rh, item: n.item }); cx += cw; });
    return { x: q.x, y: q.y + rh, w: q.w, h: q.h - rh };
  };
  let i = 0;
  while (i < nodes.length) {
    const side = Math.min(rect.w, rect.h), n = nodes[i];
    if (!row.length || worst(row.concat([n]), side) <= worst(row, side)) { row.push(n); i++; }
    else { rect = lay(row, rect); row = []; }
  }
  if (row.length) lay(row, rect);
  return out;
}

  rrush: { name: 'Rrush', kind: 'perennial',
    months: [[1, 'prune', 'Krasitja dimërore'], [2, 'prune', 'Përfundimi i krasitjes dhe lidhja e shtyllave'], [4, 'scout', 'Vëzhgim për mildiu pas shiut'], [5, 'care', 'Heqja e filizave dhe rregullimi i bimëve'], [6, 'protect', 'Trajtim parandalues kundër oidiumit'], [8, 'scout', 'Kontroll i pjekjes së rrushit'], [9, 'harvest', 'Vjelja e rrushit']],
    season: ['Pushim dimëror', 'Krasitje', 'Çelje sythash', 'Çelje sythash', 'Rritje e filizave', 'Lulëzim', 'Lidhje frutash', 'Rritje frutash', 'Pjekje', 'Vjelje', 'Pas vjeljes', 'Pushim dimëror'] }
};
const SENS_FROST = ['domate', 'speca', 'kastravec', 'patate', 'miser'];
const SENS_HEAT = ['domate', 'speca', 'kastravec', 'patate', 'miser'];
const FUNGAL = ['domate', 'speca', 'kastravec', 'patate', 'rrush', 'ulli', 'grure'];

const cropName = k => (CROPS[k] || {}).name || 'Pa kulturë';

function isActive(p, t) {
  const c = CROPS[p.crop];
  if (!c || !p.planted) return false;
  if (c.kind === 'perennial') return true;
  const d = diffDays(p.planted, t);
  return d >= 0 && d < c.cycle;
}

function stageOf(p, t) {
  const c = CROPS[p.crop];
  if (!c) return null;
  if (!p.planted) return { state: 'none', label: 'Pa datë mbjelljeje', pct: 0 };
  if (c.kind === 'perennial') return { state: 'season', label: c.season[+t.slice(5, 7) - 1], pct: null };
  const d = diffDays(p.planted, t);
  if (d < 0) return { state: 'planned', label: 'Mbjellja pas ' + (-d) + ' ditësh', pct: 0, day: d };
  if (d >= c.cycle) return { state: 'done', label: 'Cikli përfundoi', pct: 1, day: d };
  const s = c.stages.find(x => d >= x[1] && d < x[2]);
  return { state: 'growing', label: s ? s[0] : '', pct: d / c.cycle, day: d, left: c.cycle - d };
}

/* Detyrat nga kalendari i kulturës. Detyrat më të vjetra se 7 ditë nuk krijohen, që të mos mbushet lista me të vonuara. */
function genTasks(p, t) {
  const c = CROPS[p.crop];
  if (!c || !p.planted) return [];
  const out = [];
  if (c.kind === 'annual') {
    c.tasks.forEach((x, i) => {
      const due = addDays(p.planted, x[0]);
      if (due >= addDays(t, -7)) out.push({ id: uid('t') + i.toString(36), plotId: p.id, type: x[1], title: x[2], due: due, done: false, auto: true });
    });
  } else {
    const y = +t.slice(0, 4), m = +t.slice(5, 7);
    c.months.forEach((x, i) => {
      let due = (x[0] >= m ? y : y + 1) + '-' + pad(x[0]) + '-10';
      if (due < t) due = t;
      out.push({ id: uid('t') + i.toString(36), plotId: p.id, type: x[1], title: x[2], due: due, done: false, auto: true });
    });
  }
  return out;
}

const plotHealth = (S, p) => Math.max(0, ...S.scouting.filter(s => s.plotId === p.id && !s.resolved).map(s => +s.sev || 1));
const wxIcon = d => (+d.rain >= 1 ? 'rain' : (+d.hum >= 80 ? 'cloud' : 'sun'));

/* ===== Motori i alarmeve: rregulla mbi motin, detyrat dhe vëzhgimet ===== */
function buildAlerts(S, t) {
  const out = [];
  const m = +t.slice(5, 7);
  const days = ((S.weather && S.weather.days) || []).filter(d => d.date >= t).sort((a, b) => a.date < b.date ? -1 : 1).slice(0, 5)
    .map(d => ({ date: d.date, tmax: +d.tmax || 0, tmin: +d.tmin || 0, rain: +d.rain || 0, hum: +d.hum || 0, wind: +d.wind || 0 }));
  const near = days.filter(d => diffDays(t, d.date) <= 2);
  const live = S.plots.filter(p => isActive(p, t));
  const field = live.filter(p => p.growing !== 'greenhouse');
  const ids = a => a.map(p => p.id);
  const add = (sev, title, text, plotIds, kind) => out.push({ sev: sev, title: title, text: text, plotIds: plotIds || [], kind: kind || 'weather' });
  const avg = d => (d.tmax + d.tmin) / 2;

  if (days.length) {
    const fr = days.find(d => d.tmin <= 1), frP = field.filter(p => SENS_FROST.indexOf(p.crop) >= 0);
    if (fr && frP.length) add(fr.tmin <= -2 ? 'bad' : 'warn', 'Rrezik acari më ' + fmtShort(fr.date), 'Minimalja pritet ' + num(fr.tmin, 1) + '°C. Mbulo bimët e ndjeshme ose shtyje mbjelljen.', ids(frP));

    const ht = days.find(d => d.tmax >= 35), htP = field.filter(p => SENS_HEAT.indexOf(p.crop) >= 0);
    if (ht && htP.length) add(ht.tmax >= 38 ? 'bad' : 'warn', 'Nxehtësi e lartë më ' + fmtShort(ht.date), 'Maksimalja pritet ' + num(ht.tmax, 0) + '°C. Ujit herët në mëngjes ose në mbrëmje.', ids(htP));

    const wet = near.filter(d => d.hum >= 80 && avg(d) >= 8 && avg(d) <= 26);
    const fgP = live.filter(p => FUNGAL.indexOf(p.crop) >= 0 && !(p.crop === 'rrush' && (m < 4 || m > 9)));
    if (wet.length >= 2 && fgP.length) {
      const rain3 = sum(near, d => d.rain);
      add(wet.length >= 3 && rain3 >= 10 ? 'bad' : 'warn', 'Rrezik sëmundjesh nga lagështia', 'Lagështi e lartë dhe temperatura të buta në ' + wet.length + ' nga 3 ditët e ardhshme. Kontrollo bimët, ventilo serrat dhe trajto vetëm sipas këshillës së agronomit.', ids(fgP));
    }

    const dryP = field.filter(p => CROPS[p.crop].kind === 'annual');
    if (days.length >= 5 && sum(days, d => d.rain) < 2 && Math.max.apply(null, days.map(d => d.tmax)) >= 28 && dryP.length)
      add('info', 'Pa shi për 5 ditë', 'Planifiko ujitjen për kulturat në rritje.', ids(dryP));

    S.tasks.filter(x => !x.done && x.due >= t && diffDays(t, x.due) <= 3).forEach(x => {
      const d = days.find(q => q.date === x.due);
      const p = S.plots.find(q => q.id === x.plotId);
      if (!d || (p && p.growing === 'greenhouse')) return;
      const pid = x.plotId ? [x.plotId] : [];
      if (d.rain >= 10 && ['harvest', 'protect', 'fertilize', 'care'].indexOf(x.type) >= 0)
        add('warn', 'Shi ' + num(d.rain, 0) + ' mm më ' + fmtShort(d.date), 'Shtyje detyrën «' + x.title + '».', pid);
      else if (d.wind >= 20 && x.type === 'protect')
        add('warn', 'Erë ' + num(d.wind, 0) + ' km/h më ' + fmtShort(d.date), 'Mos spërkat. Shtyje «' + x.title + '».', pid);
      else if (x.type === 'irrigate') {
        const prev = days.find(q => q.date === addDays(x.due, -1));
        if (d.rain >= 6 || (prev && prev.rain >= 6)) add('info', 'Ujitja mund të anashkalohet', '«' + x.title + '» më ' + fmtShort(x.due) + ': pritet shi.', pid);
      }
    });
  }

  const late = S.tasks.filter(x => !x.done && x.due < t).sort(byDue);
  if (late.length) add('warn', late.length + (late.length === 1 ? ' detyrë e vonuar' : ' detyra të vonuara'), 'Më e vjetra: «' + late[0].title + '» (' + fmtShort(late[0].due) + ').', late.map(x => x.plotId).filter((v, i, a) => v && a.indexOf(v) === i), 'task');

  S.scouting.filter(x => !x.resolved && x.sev >= 2).forEach(x =>
    add(x.sev >= 3 ? 'bad' : 'warn', SCOUT[x.kind] || 'Vëzhgim', (x.text ? x.text + ' · ' : '') + fmtShort(x.date), x.plotId ? [x.plotId] : [], 'scout'));

  const ord = { bad: 0, warn: 1, info: 2 };
  return out.sort((a, b) => ord[a.sev] - ord[b.sev]);
}

/* ===== Financat ===== */
const inPeriod = (date, per, t) => per === 'all' || String(date).slice(0, 4) === t.slice(0, 4);
function finance(S, per, t) {
  const ex = S.expenses.filter(e => inPeriod(e.date, per, t));
  const hv = S.harvests.filter(h => inPeriod(h.date, per, t));
  const cost = sum(ex, e => e.amount), rev = sum(hv, h => h.qty * h.price);
  const byCat = {};
  ex.forEach(e => { byCat[e.cat] = (byCat[e.cat] || 0) + (+e.amount || 0); });
  const byPlot = S.plots.map(p => {
    const c = sum(ex.filter(e => e.plotId === p.id), e => e.amount);
    const r = sum(hv.filter(h => h.plotId === p.id), h => h.qty * h.price);
    const q = sum(hv.filter(h => h.plotId === p.id), h => h.qty);
    return { p: p, cost: c, rev: r, qty: q, net: r - c };
  });
  const common = sum(ex.filter(e => !S.plots.some(p => p.id === e.plotId)), e => e.amount);
  const ha = sum(S.plots, p => p.area);
  return { ex: ex, hv: hv, cost: cost, rev: rev, net: rev - cost, byCat: byCat, byPlot: byPlot, common: common, ha: ha, perHa: ha ? cost / ha : 0 };
}
const nextLot = (S, date) => 'L-' + date.slice(0, 4) + '-' + String(S.harvests.filter(h => String(h.date).slice(0, 4) === date.slice(0, 4)).length + 1).padStart(3, '0');

  const w = [[19, 11, 1, 70, 8], [17, 10, 14, 86, 12], [16, 9, 9, 88, 9], [18, 8, 0, 72, 22], [20, 9, 0, 60, 10]];

}

function load() {
  try { const r = localStorage.getItem(LS); if (r) S = JSON.parse(r); } catch (e) { S = null; }
  if (!S || !S.plots) seed();
}
function persistLocal() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { } }

function save() {
  persistLocal();
  clearTimeout(timer);
  timer = setTimeout(flush, 700);
}
async function flush() {
  if (!dbDoc) return;
  if (writing) { again = true; return; }
  writing = true;
  try { await dbDoc.set({ state: JSON.stringify(S), at: Date.now() }); saveState = 'U ruajt'; }
  catch (e) { saveState = 'Vetëm në këtë shfletues'; }
  writing = false;
  if (again) { again = false; flush(); } else paintStatus();
}
async function connect() {
  try {
    const cl = window.claude;
    const db = cl && cl.use ? await cl.use('db') : null;
    if (!db) return;
    dbDoc = db.doc('farm/main');
    const snap = await dbDoc.get();
    if (snap.exists && snap.data() && snap.data().state) { S = JSON.parse(snap.data().state); persistLocal(); saveState = 'U ruajt'; render(); }
    else flush();
  } catch (e) { dbDoc = null; }
  paintStatus();
}
function paintStatus() { const el = document.getElementById('status'); if (el) el.textContent = saveState; }

function openModal(html) {
  const m = document.getElementById('modal');

  m.hidden = false;
  const f = m.querySelector('input,select,textarea,button'); if (f) f.focus();
}
function closeModal() { const m = document.getElementById('modal'); m.hidden = true; m.innerHTML = ''; }

function fieldHtml(f, v) {
  const val = v == null ? '' : v, id = 'f_' + f.n;
  let inp;
  if (f.t === 'select') inp = '<select id="' + id + '" name="' + f.n + '">' + f.opts.map(o => '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(val) ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>';
  else if (f.t === 'textarea') inp = '<textarea id="' + id + '" name="' + f.n + '" rows="2">' + esc(val) + '</textarea>';
  else inp = '<input id="' + id + '" name="' + f.n + '" type="' + (f.t === 'number' ? 'text' : f.t || 'text') + '"' + (f.t === 'number' ? ' inputmode="decimal"' : '') + ' value="' + esc(val) + '"' + (f.req ? ' required' : '') + '>';
  return '<label' + (f.full ? ' class="full"' : '') + '>' + esc(f.l) + inp + '</label>';
}
function formModal(title, fields, vals, onOk, extra) {

/* Shton ose ndryshon një rekord; id e re krijohet vetëm kur mungon */
function edit(kind, fields, vals, title, after) {
  const cur = vals && vals._r;
  formModal(title, fields, vals, o => {
    if (o.sev != null) o.sev = +o.sev;
    if (cur) Object.assign(cur, o); else { const r = Object.assign({ id: uid(kind[0]) }, o); COLL[kind]().push(r); if (after) after(r); }
    save();
  }, cur ? delBtn(kind, keyOf(kind, cur)) : '');
}
const withRec = (kind, id, extra) => { const r = find(kind, id); return Object.assign({}, r, { _r: r }, extra); };

function act(a, el) {
  const id = el.dataset.id;
  switch (a) {
    case 'close': closeModal(); break;
    case 'toggle': { const x = find('task', id); if (x) { x.done = !x.done; save(); render(); } break; }
    case 'add-task': edit('task', taskFields(), { due: T, type: 'other', plotId: '' }, 'Detyrë e re'); break;
    case 'edit-task': edit('task', taskFields(), withRec('task', id), 'Ndrysho detyrën'); break;
    case 'add-plot': edit('plot', plotFields(), { area: 1, growing: 'field', irrig: 'none', crop: '' }, 'Parcelë e re', p => { S.tasks = S.tasks.concat(genTasks(p, T)); }); break;
    case 'plot': case 'edit-plot': edit('plot', plotFields(), withRec('plot', id), 'Ndrysho parcelën'); break;
    case 'gen': {
      const p = find('plot', id), add = genTasks(p, T).filter(n => !S.tasks.some(x => x.plotId === id && x.title === n.title && x.due === n.due));
      S.tasks = S.tasks.concat(add); save(); tab = 'tasks'; tf = 'open'; render(); break;
    }
    case 'scout-add': edit('scout', scoutFields(), { plotId: id || (S.plots[0] || {}).id || '', kind: 'pest', sev: 1, date: T, text: '', resolved: false }, 'Vëzhgim i ri'); break;
    case 'edit-scout': edit('scout', scoutFields(), withRec('scout', id), 'Ndrysho vëzhgimin'); break;
    case 'resolve': { const s = find('scout', id); s.resolved = !s.resolved; save(); render(); break; }
    case 'add-exp': edit('exp', expFields(), { date: T, cat: 'other', plotId: '', amount: 0 }, 'Shpenzim i ri'); break;
    case 'edit-exp': edit('exp', expFields(), withRec('exp', id), 'Ndrysho shpenzimin'); break;
    case 'add-hv': edit('hv', hvFields(), { date: T, plotId: (S.plots[0] || {}).id || '', qty: 0, price: 0 }, 'Të korra të reja', r => { r.lot = nextLot(S, r.date); }); break;
    case 'edit-hv': edit('hv', hvFields(), withRec('hv', id), 'Ndrysho të korrën'); break;
    case 'add-wx': edit('wx', wxFields(), { date: addDays(S.weather.days.reduce((m, d) => d.date > m ? d.date : m, addDays(T, -1)), 1), tmax: 20, tmin: 10, rain: 0, hum: 60, wind: 8 }, 'Ditë e re'); break;
    case 'edit-wx': {
      const r = S.weather.days.find(x => x.date === id);
      formModal('Ndrysho motin', wxFields(), r, o => { Object.assign(r, o); save(); }, delBtn('wx', id)); break;
    }
    case 'del': {
      const k = el.dataset.k, r = find(k, id), list = COLL[k]();
      confirmModal('Ta fshij këtë rekord?', () => { list.splice(list.indexOf(r), 1); save(); });
      break;
    }
    case 'clear-sample':
      confirmModal('Do të fshihen të gjitha të dhënat shembull. Fillon me fermë të zbrazët.', () => { S.sample = false; S.plots = []; S.tasks = []; S.scouting = []; S.expenses = []; S.harvests = []; S.weather = { days: [] }; save(); });
      break;
  }
}

document.addEventListener('click', e => {
  if (e.target.id === 'modal') return closeModal();
  const el = e.target.closest('[data-act],[data-go],[data-tf],[data-per],[data-tab],[data-pick]');
  if (!el) return;
  if (el.dataset.pick) bioPick(el);
  else if (el.dataset.act) { if (!bioAct(el.dataset.act, el)) act(el.dataset.act, el); }
  else if (el.dataset.go) go(el.dataset.go);
  else if (el.dataset.tab) go(el.dataset.tab);
  else if (el.dataset.tf) { tf = el.dataset.tf; render(); }
  else if (el.dataset.per) { per = el.dataset.per; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function sheetTotals(c) {
  const m = S.bio.sheets.filter(s => norm(s.parcel) === norm(c.parcel) && norm(s.product) === norm(c.product));
  return { has: m.length > 0, fresh: sum(m, s => sum(rowsOf(s), r => r.fresh)), dry: sum(m, s => sum(rowsOf(s), r => r.dry)) };
}
function viewCult() {
  ensureBio();
  const rows = S.bio.cult, tot = rows.map(sheetTotals);
  return '<section class="sec">' + tabHead('Kultivime BioBes ' + T.slice(0, 4), 'horizontal', pdfBtn('cult') + '<button class="btn pri" data-act="add-cult">Shto rresht</button>') +
    '<div class="paper"><div class="tw"><table class="xt"><tr><th>Parcela</th><th>Produkti</th><th class="r">Sasi e miratuar</th><th>Dt e fillimit të vjeljes</th><th>Dt e mbarimit të vjeljes</th><th class="r">Mbledhur njomë</th><th class="r">Mbledhur thatë</th><th class="r">Eksportuar</th><th class="r">Stoku</th><th>Komente</th><th></th></tr>' +
    (rows.length ? rows.map((c, i) => '<tr><td>' + esc(c.parcel) + '</td><td>' + esc(c.product) + '</td><td class="r">' + num(c.approved) + '</td><td>' + esc(c.start) + '</td><td>' + esc(c.end) + '</td><td class="r">' + (tot[i].has ? num(tot[i].fresh) : '') + '</td><td class="r">' + (tot[i].has ? num(tot[i].dry) : '') + '</td><td class="r">' + num(c.exported) + '</td><td class="r">' + num(c.stock) + '</td><td class="wrapc">' + esc(c.comment) + '</td><td><button class="btn sm" data-act="edit-cult" data-id="' + c.id + '">Ndrysho</button></td></tr>').join('') +
      '<tr class="tot"><td colspan="2">Gjithsej</td><td class="r">' + num(sum(rows, c => c.approved)) + '</td><td></td><td></td><td class="r">' + num(sum(tot, x => x.fresh)) + '</td><td class="r">' + num(sum(tot, x => x.dry)) + '</td><td class="r">' + num(sum(rows, c => c.exported)) + '</td><td class="r">' + num(sum(rows, c => c.stock)) + '</td><td colspan="2"></td></tr>' : '<tr><td colspan="11" class="muted">Asnjë rresht. Shto parcelën dhe produktin; sasitë e mbledhura merren automatikisht nga fletët e vjeljes me të njëjtën parcelë dhe produkt.</td></tr>') + '</table></div></div></section>';
}

/* ---- Fletët e vjeljes ---- */
const sheetFields = () => [{ n: 'product', l: 'Produkti', req: 1, full: 1 }, { n: 'parcel', l: 'Parcela (p.sh. K02/1)', req: 1 }, { n: 'approved', l: 'Sasia e miratuar (kg)', t: 'number' }, { n: 'report', l: 'Raporti (p.sh. 4/1)', full: 1 }];
function picker(list, cur, lab, act) {
  return '<div class="row">' + list.map(x => '<button class="chip pickc" data-pick="' + act + '" data-id="' + x.id + '" aria-pressed="' + (x.id === cur) + '">' + esc(lab(x)) + '</button>').join('') + '</div>';
}
function viewSheets() {
  ensureBio();
  const L = S.bio.sheets; if (!L.find(s => s.id === curSheet)) curSheet = L.length ? L[0].id : '';
  const s = L.find(x => x.id === curSheet);
  let h = '<section class="sec">' + tabHead('Fleta e vjeljes', 'vertikal', (s ? pdfBtn('sheet') : '') + '<button class="btn pri" data-act="add-sheet">Fletë e re</button>');
  h += L.length ? picker(L, curSheet, x => x.parcel + ' · ' + x.product, 'sheet') : '<div class="card empty">Shto fletën e parë për një parcelë dhe produkt. Çdo ditë vjelje futet si rresht: data dhe sasia e njomë, data dhe sasia e thatë.</div>';
  if (s) {
    const fr = sum(rowsOf(s), r => r.fresh), dr = sum(rowsOf(s), r => r.dry);
    h += '<div class="paper narrow"><div class="ph col"><b>PRODUKTI : ' + esc(s.product) + '</b><span>PARCELA : ' + esc(s.parcel) + '</span><span>SASIA E MIRATUAR : ' + num(s.approved) + ' KG</span><span>RAPORTI : ' + esc(s.report) + '</span><span><button class="btn sm" data-act="edit-sheet" data-id="' + s.id + '">Ndrysho kokën</button></span></div>' +
      '<div class="tw"><table class="xt"><tr><th>Data</th><th class="r">Sasi e njomë (kg)</th><th>Data</th><th class="r">Sasi e thatë (kg)</th><th></th></tr>' +
      s.rows.map((r, i) => '<tr><td>' + cell('sheets', s.id, i, 'd1', r.d1, 'd') + '</td><td>' + cell('sheets', s.id, i, 'fresh', r.fresh, 'n') + '</td><td>' + cell('sheets', s.id, i, 'd2', r.d2, 'd') + '</td><td>' + cell('sheets', s.id, i, 'dry', r.dry, 'n') + '</td><td><button class="btn sm" data-act="bio-delrow" data-bk="sheets" data-id="' + s.id + '" data-i="' + i + '" aria-label="Fshi rreshtin">✕</button></td></tr>').join('') +
      '<tr class="tot"><td>Gjithsej</td><td class="r">' + num(fr) + '</td><td></td><td class="r">' + num(dr) + '</td><td></td></tr></table></div><div class="row" style="padding:8px"><button class="btn sm" data-act="bio-addrow" data-bk="sheets" data-id="' + s.id + '">Shto rresht</button></div></div>';
  }
  return h + '</section>';
}
/* ---- Magazina (gjendja) ---- */
const storeFields = () => [{ n: 'name', l: 'Magazina (p.sh. MAGAZINA 1 QENDRORE)', req: 1, full: 1 }, { n: 'label', l: 'Titulli i kolonës (p.sh. GJENDJE NËNTOR 14/11/2026)', full: 1 }];
function viewStores() {
  ensureBio();
  const L = S.bio.stores; if (!L.find(s => s.id === curStore)) curStore = L.length ? L[0].id : '';
  const s = L.find(x => x.id === curStore);
  let h = '<section class="sec">' + tabHead('Gjendja e magazinës', 'vertikal', (s ? pdfBtn('store') : '') + '<button class="btn pri" data-act="add-store">Magazinë e re</button>');
  h += L.length ? picker(L, curStore, x => x.name, 'store') : '<div class="card empty">Shto magazinën e parë. Çdo rresht ka produktin, kodin e lotit, gjendjen në kg dhe vendin e magazinimit.</div>';
  if (s) {
    h += '<div class="paper narrow"><div class="ph"><b>' + esc(s.name) + '</b><span>' + esc(s.label) + '</span><button class="btn sm" data-act="edit-store" data-id="' + s.id + '">Ndrysho</button></div><div class="tw"><table class="xt"><tr><th>Produkti</th><th>Kodi</th><th class="r">' + esc(s.label || 'Gjendje') + '</th><th>Magazinuar</th><th>Shënim</th><th></th></tr>' +
      s.rows.map((r, i) => '<tr><td>' + cell('stores', s.id, i, 'product', r.product) + '</td><td>' + cell('stores', s.id, i, 'code', r.code) + '</td><td>' + cell('stores', s.id, i, 'qty', r.qty, 'n') + '</td><td>' + cell('stores', s.id, i, 'where', r.where) + '</td><td>' + cell('stores', s.id, i, 'note', r.note) + '</td><td><button class="btn sm" data-act="bio-delrow" data-bk="stores" data-id="' + s.id + '" data-i="' + i + '" aria-label="Fshi rreshtin">✕</button></td></tr>').join('') +
      '<tr class="tot"><td colspan="2">Gjithsej (kg)</td><td class="r">' + num(sum(s.rows, r => r.qty)) + '</td><td colspan="3"></td></tr></table></div><div class="row" style="padding:8px"><button class="btn sm" data-act="bio-addrow" data-bk="stores" data-id="' + s.id + '">Shto rresht</button></div></div>';
  }
  return h + '</section>';
}

/* ---- Kartela e produktit ---- */
const cardFields = () => [{ n: 'product', l: 'Produkti', req: 1 }, { n: 'pcode', l: 'Kodi i produktit (p.sh. 109)' }];
const lotFields = () => [{ n: 'label', l: 'Loti (p.sh. K10/2-26)', req: 1 }];
function cardCalc(c) {
  const bal = {}; c.lots.forEach(l => { bal[l.id] = 0; });
  return c.rows.map(r => { if (r.lot && bal[r.lot] != null) bal[r.lot] += (+r.in || 0) - (+r.so || 0) - (+r.sc || 0) - (+r.firo || 0); return Object.assign({}, bal); });
}
function lotSel(c, i, v) {
  return '<select class="xc" data-bk="cards" data-id="' + c.id + '" data-i="' + i + '" data-f="lot" data-t="t"><option value="">–</option>' + c.lots.map(l => '<option value="' + l.id + '"' + (l.id === v ? ' selected' : '') + '>' + esc(l.label) + '</option>').join('') + '</select>';
}
function viewCards() {
  ensureBio();
  const L = S.bio.cards; if (!L.find(s => s.id === curCard)) curCard = L.length ? L[0].id : '';
  const c = L.find(x => x.id === curCard);
  let h = '<section class="sec">' + tabHead('Kartela e produktit ' + T.slice(0, 4), 'horizontal', (c ? pdfBtn('card') : '') + '<button class="btn pri" data-act="add-card">Produkt i ri</button>');
  h += L.length ? picker(L, curCard, x => x.product, 'card') : '<div class="card empty">Shto produktin e parë. Çdo hyrje, shitje dhe firo shënohet me lotin e parcelës, dhe gjendja e çdo loti llogaritet vetë.</div>';
  if (c) {
    const bal = cardCalc(c), last = bal.length ? bal[bal.length - 1] : {};
    h += '<div class="paper"><div class="ph col"><b>PRODUKTI : ' + esc(c.product) + '</b><span>KODI I PRODUKTIT: ' + esc(c.pcode) + '</span><span class="row">Lotet: ' + c.lots.map(l => '<button class="chip pickc" data-act="edit-lot" data-id="' + c.id + '" data-lot="' + l.id + '">' + esc(l.label) + '</button>').join('') + '<button class="btn sm" data-act="add-lot" data-id="' + c.id + '">Shto lot</button><button class="btn sm" data-act="edit-card" data-id="' + c.id + '">Ndrysho kokën</button></span></div>' +
      '<div class="tw"><table class="xt"><tr><th>Data</th><th class="r">Hyrje organike (kg)</th><th>Statusi</th><th class="r">Shitje organike (kg)</th><th class="r">Shitje konv. (kg)</th><th class="r">Firo</th><th>Loti</th>' + c.lots.map(l => '<th class="r">' + esc(l.label) + '</th>').join('') + '<th>Kodi i produktit</th><th></th></tr>' +
      c.rows.map((r, i) => '<tr><td>' + cell('cards', c.id, i, 'd', r.d, 'd') + '</td><td>' + cell('cards', c.id, i, 'in', r.in, 'n') + '</td><td>' + cell('cards', c.id, i, 'status', r.status) + '</td><td>' + cell('cards', c.id, i, 'so', r.so, 'n') + '</td><td>' + cell('cards', c.id, i, 'sc', r.sc, 'n') + '</td><td>' + cell('cards', c.id, i, 'firo', r.firo, 'n') + '</td><td>' + lotSel(c, i, r.lot) + '</td>' + c.lots.map(l => '<td class="r">' + num(bal[i][l.id]) + '</td>').join('') + '<td>' + cell('cards', c.id, i, 'code', r.code) + '</td><td><button class="btn sm" data-act="bio-delrow" data-bk="cards" data-id="' + c.id + '" data-i="' + i + '" aria-label="Fshi rreshtin">✕</button></td></tr>').join('') +
      '<tr class="tot"><td>Gjithsej</td><td class="r">' + num(sum(c.rows, r => r.in)) + '</td><td></td><td class="r">' + num(sum(c.rows, r => r.so)) + '</td><td class="r">' + num(sum(c.rows, r => r.sc)) + '</td><td class="r">' + num(sum(c.rows, r => r.firo)) + '</td><td class="r">Gjendja</td>' + c.lots.map(l => '<td class="r">' + num(last[l.id] || 0) + '</td>').join('') + '<td colspan="2" class="r">' + num(sum(c.lots, l => last[l.id])) + ' kg</td></tr></table></div><div class="row" style="padding:8px"><button class="btn sm" data-act="bio-addrow" data-bk="cards" data-id="' + c.id + '">Shto rresht</button></div></div>';
  }
  return h + '</section>';
}

/* ---- Veprime ---- */
const blankRow = bk => bk === 'sheets' ? { d1: '', fresh: 0, d2: '', dry: 0 } : bk === 'stores' ? { product: '', code: '', qty: 0, where: '', note: '' } : { d: '', in: 0, status: '', so: 0, sc: 0, firo: 0, lot: '', code: '' };
const blanks = (bk, n) => Array.from({ length: n }, () => blankRow(bk));
function flash(msg) { const el = document.getElementById('status'); if (el) { el.textContent = msg; setTimeout(paintStatus, 3500); } }

function bioAct(a, el) {
  const id = el.dataset.id;
  switch (a) {
    case 'add-rp': edit('rp', rpFields(), { total: 0 }, 'Parcelë e re'); return true;
    case 'edit-rp': edit('rp', rpFields(), withRec('rp', id), 'Ndrysho parcelën'); return true;
    case 'add-rot': if (!S.bio.rp.length) { flash('Shto së pari një parcelë'); return true; } edit('rot', rotFields(), { parcel: S.bio.rp[0].code, m2: 0 }, 'Nënparcelë e re'); return true;
    case 'edit-rot': edit('rot', rotFields(), withRec('rot', id), 'Ndrysho nënparcelën'); return true;
    case 'add-cult': edit('cult', cultFields(), { approved: 0, exported: 0, stock: 0 }, 'Rresht i ri'); return true;
    case 'edit-cult': edit('cult', cultFields(), withRec('cult', id), 'Ndrysho rreshtin'); return true;
    case 'add-sheet': edit('sheets', sheetFields(), { approved: 0 }, 'Fletë e re vjelje', r => { r.rows = blanks('sheets', 10); curSheet = r.id; }); return true;
    case 'edit-sheet': edit('sheets', sheetFields(), withRec('sheets', id), 'Ndrysho kokën e fletës'); return true;
    case 'add-store': edit('stores', storeFields(), { name: 'MAGAZINA 1 QENDRORE' }, 'Magazinë e re', r => { r.rows = blanks('stores', 10); curStore = r.id; }); return true;
    case 'edit-store': edit('stores', storeFields(), withRec('stores', id), 'Ndrysho magazinën'); return true;
    case 'add-card': edit('cards', cardFields(), {}, 'Produkt i ri', r => { r.lots = []; r.rows = blanks('cards', 8); curCard = r.id; }); return true;
    case 'edit-card': edit('cards', cardFields(), withRec('cards', id), 'Ndrysho kokën e kartelës'); return true;
    case 'add-lot': { const c = find('cards', id); formModal('Lot i ri', lotFields(), {}, o => { c.lots.push({ id: uid('l'), label: o.label }); save(); }); return true; }
    case 'edit-lot': {
      const c = find('cards', id), l = c.lots.find(x => x.id === el.dataset.lot);
      formModal('Ndrysho lotin', lotFields(), l, o => { l.label = o.label; save(); }, '<button type="button" class="btn bad" style="margin-right:auto" data-act="del-lot" data-id="' + c.id + '" data-lot="' + l.id + '">Fshi</button>'); return true;
    }
    case 'del-lot': {
      const c = find('cards', id), l = c.lots.find(x => x.id === el.dataset.lot);
      confirmModal('Ta fshij lotin? Rreshtat që e përdorin mbeten pa lot.', () => { c.lots.splice(c.lots.indexOf(l), 1); c.rows.forEach(r => { if (r.lot === l.id) r.lot = ''; }); save(); }); return true;
    }
    case 'bio-addrow': { const d = S.bio[el.dataset.bk].find(x => x.id === id); d.rows.push(blankRow(el.dataset.bk)); save(); render(); return true; }
    case 'bio-delrow': { const d = S.bio[el.dataset.bk].find(x => x.id === id); d.rows.splice(+el.dataset.i, 1); save(); render(); return true; }
    case 'pdf': exportPdf(el.dataset.k); return true;
  }
  return false;
}
function bioPick(el) { const k = el.dataset.pick; if (k === 'sheet') curSheet = el.dataset.id; else if (k === 'store') curStore = el.dataset.id; else curCard = el.dataset.id; render(); }

document.addEventListener('change', e => {
  const el = e.target, bk = el.dataset && el.dataset.bk;
  if (!bk) return;
  const d = S.bio[bk].find(x => x.id === el.dataset.id), r = d && d.rows[+el.dataset.i];
  if (!r) return;
  r[el.dataset.f] = el.dataset.t === 'n' ? numIn(el.value) : el.value.trim();
  save(); render();
});

/* ---- Eksport PDF A4 ---- */
const pnum = (n, d) => num(n, d).replace(/\u2212/g, '-');
function exportPdf(k) {
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J) { flash('Biblioteka PDF nuk u ngarkua'); return; }
  ensureBio();
  const doc = new J({ orientation: (k === 'sheet' || k === 'store') ? 'portrait' : 'landscape', unit: 'mm', format: 'a4' });
  const st = { theme: 'grid', margin: { left: 12, right: 12 }, styles: { fontSize: 8.5, cellPadding: 1.6, lineColor: [110, 110, 110], lineWidth: 0.2, textColor: 20 }, headStyles: { fillColor: [31, 122, 77], textColor: 255, fontStyle: 'bold' }, footStyles: { fillColor: [226, 238, 230], textColor: 20, fontStyle: 'bold' } };
  const line = (t, y, b) => { doc.setFont('helvetica', b ? 'bold' : 'normal'); doc.setFontSize(b ? 13 : 10); doc.text(String(t), 12, y); };
  const tbl = o => { doc.autoTable(Object.assign({}, st, o)); return doc.lastAutoTable.finalY; };
  const R = { halign: 'right' };
  let name = 'BioBes.pdf';
  if (k === 'rot') {
    name = 'Plan_qarkullimi.pdf'; line('PLAN QARKULLIMI ' + YEARS[0] + '-' + YEARS[YEARS.length - 1], 14, 1); let y = 22;
    S.bio.rp.forEach(p => {
      if (y > 170) { doc.addPage(); y = 14; }
      line('PARCELA: ' + p.code + '    ADRESA: ' + p.address + '    SIP TOTALE ' + pnum(p.total) + ' m2', y);
      y = tbl({ startY: y + 3, head: [['Nenparcela', 'm2'].concat(YEARS)], body: S.bio.rot.filter(r => r.parcel === p.code).map(r => [r.sub, pnum(r.m2)].concat(YEARS.map(yy => r['y' + yy] || ''))), columnStyles: { 1: R } }) + 9;
    });
  } else if (k === 'cult') {
    name = 'Kultivime_' + T.slice(0, 4) + '.pdf'; line('KULTIVIME BIOBES ' + T.slice(0, 4), 14, 1);
    const tt = S.bio.cult.map(sheetTotals);
    tbl({ startY: 20, head: [['Parcela', 'Produkti', 'Sasi e miratuar', 'Dt e fillimit te vjeljes', 'Dt e mbarimit te vjeljes', 'Mbledhur njome', 'Mbledhur thate', 'Eksportuar', 'Stoku', 'Komente']],
      body: S.bio.cult.map((c, i) => [c.parcel, c.product, pnum(c.approved), c.start || '', c.end || '', tt[i].has ? pnum(tt[i].fresh) : '', tt[i].has ? pnum(tt[i].dry) : '', pnum(c.exported), pnum(c.stock), c.comment || '']),
      foot: [['Gjithsej', '', pnum(sum(S.bio.cult, c => c.approved)), '', '', pnum(sum(tt, x => x.fresh)), pnum(sum(tt, x => x.dry)), pnum(sum(S.bio.cult, c => c.exported)), pnum(sum(S.bio.cult, c => c.stock)), '']], columnStyles: { 2: R, 5: R, 6: R, 7: R, 8: R } });
  } else if (k === 'sheet') {
    const s = find('sheets', curSheet); name = 'Fleta_vjeljes_' + String(s.parcel).replace(/[^\w-]/g, '_') + '.pdf';
    line('PRODUKTI : ' + s.product, 16, 1); line('PARCELA : ' + s.parcel, 23); line('SASIA E MIRATUAR : ' + pnum(s.approved) + ' KG', 29); line('RAPORTI : ' + (s.report || ''), 35);
    tbl({ startY: 41, head: [['Data', 'Sasi e njome (kg)', 'Data', 'Sasi e thate (kg)']], body: s.rows.map(r => [fmtDate(r.d1), r.fresh ? pnum(r.fresh) : '', fmtDate(r.d2), r.dry ? pnum(r.dry) : '']), foot: [['Gjithsej', pnum(sum(s.rows, r => r.fresh)), '', pnum(sum(s.rows, r => r.dry))]], columnStyles: { 1: R, 3: R } });
  } else if (k === 'store') {
    const s = find('stores', curStore); name = 'Gjendja_magazina.pdf';
    line(s.name, 16, 1);
    tbl({ startY: 22, head: [['Produkti', 'Kodi', s.label || 'Gjendje', 'Magazinuar', 'Shenim']], body: s.rows.filter(r => r.product || r.code || r.qty).map(r => [r.product, r.code, pnum(r.qty), r.where, r.note]), foot: [['Gjithsej (kg)', '', pnum(sum(s.rows, r => r.qty)), '', '']], columnStyles: { 2: R } });
  } else if (k === 'card') {
    const c = find('cards', curCard), bal = cardCalc(c), last = bal.length ? bal[bal.length - 1] : {}; name = 'Kartela_' + String(c.product).replace(/[^\w-]/g, '_') + '.pdf';
    line('KARTELE PRODUKTI ' + T.slice(0, 4), 14, 1); line('PRODUKTI : ' + c.product, 21); line('KODI I PRODUKTIT: ' + (c.pcode || ''), 27);
    tbl({ startY: 32, head: [['Data', 'Hyrje organike (kg)', 'Statusi', 'Shitje organike (kg)', 'Shitje konvencionale (kg)', 'Firo'].concat(c.lots.map(l => l.label), ['Kodi i produktit'])],
      body: c.rows.filter(r => r.d || r.in || r.so || r.sc || r.firo || r.status).map(r => { const i = c.rows.indexOf(r); return [fmtDate(r.d), pnum(r.in), r.status || '', pnum(r.so), pnum(r.sc), pnum(r.firo)].concat(c.lots.map(l => pnum(bal[i][l.id])), [r.code || '']); }),
      foot: [['Gjithsej', pnum(sum(c.rows, r => r.in)), '', pnum(sum(c.rows, r => r.so)), pnum(sum(c.rows, r => r.sc)), pnum(sum(c.rows, r => r.firo))].concat(c.lots.map(l => pnum(last[l.id] || 0)), [''])] });
  }
  const n = doc.getNumberOfPages(), w = doc.internal.pageSize.getWidth(), hh = doc.internal.pageSize.getHeight();
  for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.text('Faqe ' + i + '/' + n + '  ' + fmtDate(T), w - 12, hh - 6, { align: 'right' }); }
  Promise.resolve(DL.save({ filename: name, data: doc.output('arraybuffer') })).then(() => flash('PDF u shkarkua'), e => { if (!e || e.code !== 'declined') flash('PDF nuk u ruajt'); });
}

/* ---- Skedat e reja në aplikacion ---- */
TABS.push(['rot', 'Qarkullimi'], ['cult', 'Kultivime'], ['sheets', 'Fletë vjelje'], ['stores', 'Magazina'], ['cards', 'Kartela']);
Object.assign(VIEWS, { rot: viewRot, cult: viewCult, sheets: viewSheets, stores: viewStores, cards: viewCards });
async function connectDL() { try { const cl = window.claude; DL = cl && cl.use ? await cl.use('downloads') : null; } catch (e) { DL = null; } if (DL) render(); }
load();
ensureBio();
render();
connect();
connectDL();
</script>
