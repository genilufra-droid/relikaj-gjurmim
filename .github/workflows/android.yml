name: Ndërto APK

# Ndërton APK-në e BioBes Farm. Vetëm main mund të përditësojë publikimin apk-latest.
# Degët e provës dhe PR-të prodhojnë vetëm artefakte, pa prekur shkarkimin publik.
on:
  workflow_dispatch:
  push:
    branches: [main, master, "arena/**"]
  pull_request:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Expo → APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pranimi i lejeve të Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Instalimi i paketave
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Gjenerimi i projektit Android
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Ndërtimi i APK-së (release)
        run: |
          set -o pipefail
          export GRADLE_OPTS="-Xmx4g -Dorg.gradle.daemon=false"
          cd android
          chmod +x gradlew
          # një ripërpjekje automatike: ndërtimi i parë ndonjëherë dështon për arsye rrjeti/memorie
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log \
            || (echo "== Ripërpjekje ==" && ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee -a /tmp/gradle.log)

      # Publiko logun vetëm te PR-ja që shkaktoi këtë ekzekutim, jo te një PR tjetër.
      - name: Publiko logun e dështimit
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          tail -c 55000 /tmp/gradle.log > /tmp/tail.log 2>/dev/null || echo "pa log" > /tmp/tail.log
          { echo "### Logu i ndërtimit (fundi)"; echo '```'; cat /tmp/tail.log; echo '```'; } > /tmp/body.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/body.md || true

      - name: Përgatitja e skedarit
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/BioBes-Farm.apk
          ls -lh out/BioBes-Farm.apk
          echo "APK_SIZE=$(du -h out/BioBes-Farm.apk | cut -f1)" >> "$GITHUB_ENV"

      - name: Ruajtja si artefakt
        uses: actions/upload-artifact@v4
        with:
          name: BioBes-Farm-APK-${{ github.run_number }}
          path: out/BioBes-Farm.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publikimi te «Releases» (shkarkim i thjeshtë nga telefoni)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          note="APK e ndërtuar automatikisht nga dega ${BRANCH} (${SHA:0:7}) më $(date -u +'%d/%m/%Y %H:%M UTC')."
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest out/BioBes-Farm.apk --clobber
            gh release edit apk-latest --notes "$note"
          else
            gh release create apk-latest out/BioBes-Farm.apk \
              --title "BioBes Farm — APK (versioni më i fundit)" --notes "$note" --target "$SHA"
          fi

      - name: Përmbledhje
        env:
          PUBLISHED: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          {
            echo "## APK gati ✅"
            echo ""
            echo "- Skedari: \`BioBes-Farm.apk\` (${{ env.APK_SIZE }})"
            echo "- Artefakt: **BioBes-Farm-APK-${{ github.run_number }}** (te faqja e këtij ekzekutimi)"
            if [ "$PUBLISHED" = 'true' ]; then
              echo "- Shkarkim i përhershëm: https://github.com/${{ github.repository }}/releases/download/apk-latest/BioBes-Farm.apk"
            else
              echo "- Ndërtim prove: publikimi apk-latest nuk u ndryshua."
            fi
            echo "- Instalimi: shkarkoni APK-në në telefon → «Install» (duhet leja «Install unknown apps»)"
          } >> "$GITHUB_STEP_SUMMARY"
